<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planning · Empresas Inteligentes</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>:root{
  --bg:#F4F2F7; --surface:#FFFFFF; --surface-2:#FAF8FC; --ink:#221028; --ink-2:#4D3C54; --muted:#76687C;
  --line:#E3DCE8; --line-2:#EFEAF2; --plum:#3D003F; --plum-2:#5A1463; --magenta:#A63ACB; --lav:#E89BFF;
  --neon:#86F874; --ok:#1F8A3E; --warn:#B45309; --bad:#B91C1C; --focus:#A63ACB;
  --shadow:0 1px 2px rgba(34,16,40,.06),0 4px 14px rgba(34,16,40,.06);
  --r-s:6px; --r-m:10px; --r-l:16px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#150A18; --surface:#1F1223; --surface-2:#26172B; --ink:#F3ECF5; --ink-2:#D5C8DA; --muted:#A596AB;
  --line:#3A2A40; --line-2:#2E2033; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); --ok:#5FD37F; --warn:#F2A64A; --bad:#F87171;}}
:root[data-theme="dark"]{
  --bg:#150A18; --surface:#1F1223; --surface-2:#26172B; --ink:#F3ECF5; --ink-2:#D5C8DA; --muted:#A596AB;
  --line:#3A2A40; --line-2:#2E2033; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); --ok:#5FD37F; --warn:#F2A64A; --bad:#F87171;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Urbanist',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
.top{background:
  radial-gradient(ellipse 70% 120% at 85% 120%,rgba(166,58,203,.55),transparent 60%),
  radial-gradient(ellipse 40% 80% at 10% 0%,rgba(134,248,116,.10),transparent 60%),
  linear-gradient(160deg,#2A0030 0%,#3D003F 45%,#5A1463 100%);
  color:#fff;padding:22px clamp(16px,3vw,36px) 18px}
.top-row{display:flex;gap:24px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.brand small{display:block;color:rgba(255,255,255,.7);font-size:13px;font-weight:500}
.brand h1{margin:4px 0 0;font-size:clamp(24px,3.4vw,38px);font-weight:800;letter-spacing:-.02em;line-height:1.05}
.brand p{margin:6px 0 0;color:rgba(255,255,255,.78);font-size:14px}
.count{display:flex;gap:22px;align-items:flex-end}
.count .big{font-size:clamp(40px,5vw,60px);font-weight:800;letter-spacing:-.03em;line-height:.9;color:var(--neon)}
.count .lbl{font-size:13px;color:rgba(255,255,255,.75);max-width:110px}
.prog{min-width:180px}
.prog .bar{height:8px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:6px}
.prog .bar i{display:block;height:100%;background:var(--neon);border-radius:99px;transition:width .4s}
.prog .lbl{max-width:none}

/* timeline track */
.track{position:relative;margin-top:22px;height:64px;user-select:none}
.track .rail{position:absolute;left:0;right:0;top:16px;height:2px;background:rgba(255,255,255,.22)}
.track .done{position:absolute;left:0;top:16px;height:2px;background:var(--neon)}
.track .wk{position:absolute;top:0;height:64px;border:0;background:transparent;color:rgba(255,255,255,.7);font-size:12px;font-weight:600;text-align:left;padding:28px 0 0 8px;border-left:1px solid rgba(255,255,255,.18)}
.track .wk .dt{display:block}
.track .wk b{display:block;color:#fff;font-weight:700;font-size:13px}
.track .wk.on{background:rgba(255,255,255,.08)}
.track .wk:hover{background:rgba(255,255,255,.06)}
.track .ms{position:absolute;top:11px;width:12px;height:12px;margin-left:-6px;transform:rotate(45deg);background:var(--lav);border:2px solid #3D003F;border-radius:2px;pointer-events:none}
.track .ms.ok{background:var(--neon)}
.track .today{position:absolute;top:4px;height:26px;width:2px;background:var(--neon)}
.track .today::after{content:'Hoy';position:absolute;top:-8px;left:6px;font-size:11px;font-weight:700;color:var(--neon)}
.track .d-day{position:absolute;right:-4px;top:6px;width:22px;height:22px;border-radius:50%;background:var(--neon);box-shadow:0 0 0 6px rgba(134,248,116,.18)}

/* ---------- toolbar ---------- */
.bar-wrap{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px clamp(16px,3vw,36px)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:7px;font-weight:600;color:var(--ink-2);min-height:36px}
.seg button[aria-pressed="true"]{background:var(--plum-2);color:#fff}
.fld{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 10px;min-height:40px}
.fld input,.fld select{border:0;background:transparent;outline:none;min-height:38px;max-width:180px}
.fld input{width:220px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 14px;min-height:40px;font-weight:600}
.btn.pri{background:var(--plum-2);border-color:var(--plum-2);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.spacer{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 clamp(16px,3vw,36px) 10px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 11px;font-size:13px;font-weight:600;color:var(--ink-2);min-height:32px}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="false"]{opacity:.45}
.chip .n{color:var(--muted);font-weight:500}
.banner{margin:12px clamp(16px,3vw,36px) 0;padding:10px 14px;border-radius:10px;background:var(--surface);border:1px dashed var(--line);color:var(--ink-2);font-size:14px}

main{padding:18px clamp(16px,3vw,36px) 60px}

/* ---------- week view ---------- */
.wk-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.wk-head h2{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em}
.wk-head .sub{color:var(--muted);font-weight:500}
.wk-nav{display:flex;gap:6px;margin-left:auto}
.wk-stats{display:flex;gap:18px;flex-wrap:wrap;color:var(--ink-2);font-size:14px;margin-bottom:16px}
.wk-stats b{font-size:18px;color:var(--ink)}
.carry{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:12px 14px;margin-bottom:16px}
.carry h3,.col h3{margin:0 0 8px;font-size:14px;font-weight:700;color:var(--ink-2)}
.carry .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.days{display:grid;grid-template-columns:repeat(var(--n),minmax(210px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r-l);padding:10px;min-height:160px}
.col.today{border-color:var(--magenta);box-shadow:inset 0 3px 0 var(--magenta)}
.col.event{background:linear-gradient(180deg,rgba(134,248,116,.18),var(--surface-2) 40%)}
.col .dh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.col .dh b{font-size:15px;text-transform:capitalize}
.col .dh span{color:var(--muted);font-size:12px}
.col .hol{font-size:12px;color:var(--warn);font-weight:600;margin:-4px 0 8px}
.col .stack{display:flex;flex-direction:column;gap:8px}
.col.drop{outline:2px dashed var(--magenta);outline-offset:-4px}
.empty-day{color:var(--muted);font-size:13px;padding:6px 2px}
@media (max-width:760px){.days{grid-template-columns:1fr;overflow:visible}}

/* ---------- card ---------- */
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:9px 10px 9px 14px;box-shadow:var(--shadow);cursor:pointer;text-align:left;width:100%}
.card::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--c)}
.card:hover{border-color:color-mix(in srgb,var(--c) 50%,var(--line))}
.card .row1{display:flex;gap:8px;align-items:flex-start}
.card .t{font-weight:650;font-size:14px;line-height:1.3;flex:1}
.card.done .t{text-decoration:line-through;color:var(--muted)}
.card .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:7px;font-size:12px;color:var(--muted)}
.card .area{color:var(--c);font-weight:700}
.badge{display:inline-flex;align-items:center;border-radius:6px;padding:1px 6px;font-size:11px;font-weight:700;background:var(--line-2);color:var(--ink-2)}
.badge.mail{background:color-mix(in srgb,#0E7490 16%,transparent);color:#0E7490}
.badge.ms{background:color-mix(in srgb,var(--magenta) 16%,transparent);color:var(--magenta)}
.badge.hi{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.badge.late{background:var(--bad);color:#fff}
.av{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--pc);color:#fff;font-size:10px;font-weight:800;margin-right:-5px;border:2px solid var(--surface)}
.avs{display:inline-flex;margin-left:auto;padding-right:5px}
.stt{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.stt[data-s="curso"]{border-color:var(--magenta);background:conic-gradient(var(--magenta) 0 50%,transparent 50% 100%)}
.stt[data-s="listo"]{border-color:var(--ok);background:var(--ok)}
.stt[data-s="listo"]::after{content:'';width:8px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.stt[data-s="bloqueado"]{border-color:var(--bad);background:var(--bad)}
.stt[data-s="bloqueado"]::after{content:'';width:10px;height:2px;background:#fff}
.stepbar{height:3px;background:var(--line-2);border-radius:99px;margin-top:7px;overflow:hidden}
.stepbar i{display:block;height:100%;background:var(--c)}

/* ---------- calendar ---------- */
.months{display:flex;flex-direction:column;gap:28px}
.month h2{margin:0 0 10px;font-size:22px;font-weight:800;text-transform:capitalize}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;background:var(--line)}
.grid .wd{background:var(--surface-2);padding:8px;font-size:12px;font-weight:700;color:var(--muted);text-transform:capitalize}
.cell{background:var(--surface);min-height:120px;padding:6px;display:flex;flex-direction:column;gap:4px}
.cell.out{background:var(--surface-2);opacity:.55}
.cell.today{box-shadow:inset 0 0 0 2px var(--magenta)}
.cell.event{background:color-mix(in srgb,var(--neon) 22%,var(--surface))}
.cell.drop{box-shadow:inset 0 0 0 2px var(--magenta);background:color-mix(in srgb,var(--magenta) 8%,var(--surface))}
.cell .dn{font-size:13px;font-weight:700;display:flex;justify-content:space-between}
.cell .dn em{font-style:normal;font-size:10px;color:var(--warn);font-weight:700}
.pill{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 10%,var(--surface));padding:3px 6px;border-radius:4px;font-size:12px;line-height:1.25;color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill.done{opacity:.5;text-decoration:line-through}
.pill.ms{background:var(--plum-2);color:#fff;border-left-color:var(--neon)}
.more{font-size:12px;color:var(--magenta);font-weight:700;border:0;background:none;text-align:left;padding:2px 4px}
@media (max-width:760px){.cell{min-height:70px}.pill{font-size:0;height:8px;padding:0}.pill.ms{height:8px}.grid .wd{font-size:10px;padding:6px 2px}}

/* ---------- table ---------- */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l)}
table{border-collapse:collapse;width:100%;min-width:980px;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line-2);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:700;background:var(--surface-2);position:sticky;top:0;cursor:pointer;white-space:nowrap}
tr.grp td{background:var(--surface-2);font-weight:800;font-size:14px;color:var(--plum-2)}
:root[data-theme="dark"] tr.grp td{color:var(--lav)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) tr.grp td{color:var(--lav)}}
td .tl{border:0;background:none;text-align:left;font-weight:650;padding:0;color:var(--ink)}
td .tl:hover{text-decoration:underline}
td input[type=date],td select{border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:3px 6px;min-height:32px}
td .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:6px}

/* ---------- emails ---------- */
.mail-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:22px}
.mail-sum div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px}
.mail-sum b{display:block;font-size:28px;font-weight:800;letter-spacing:-.02em}
.mail-sum span{font-size:13px;color:var(--ink-2)}
.rules{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:14px 18px;margin-bottom:22px;color:var(--ink-2);font-size:14px}
.rules h3{margin:0 0 6px;color:var(--ink);font-size:15px}
.rules ul{margin:0;padding-left:18px}
.lane{margin-bottom:24px}
.lane h3{margin:0;font-size:18px;font-weight:800}
.lane .ld{color:var(--muted);font-size:14px;margin:2px 0 10px;max-width:780px}
.seq{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}
.touch{flex:0 0 250px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px;text-align:left;box-shadow:var(--shadow);position:relative}
.touch .code{font-size:20px;font-weight:800;color:var(--lc)}
.touch .tt{font-weight:650;margin:2px 0 8px;line-height:1.3}
.touch dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 8px;font-size:12px}
.touch dt{color:var(--muted)}
.touch dd{margin:0;color:var(--ink-2)}
.touch .stt{position:absolute;top:10px;right:10px}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,6,24,.4);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:41;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.2);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.drawer header h2{margin:0;font-size:16px;flex:1}
.drawer .body{flex:1;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.drawer footer{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.f label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
.f input[type=text],.f input[type=date],.f select,.f textarea{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 10px;min-height:40px}
.f textarea{min-height:80px;resize:vertical}
.f .title{font-size:18px;font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media (max-width:520px){.three{grid-template-columns:1fr 1fr}}
.people{display:flex;flex-wrap:wrap;gap:6px}
.people button{border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:4px 10px;font-size:13px;font-weight:600;min-height:32px}
.people button[aria-pressed="true"]{background:var(--plum-2);color:#fff;border-color:var(--plum-2)}
.steps{display:flex;flex-direction:column;gap:4px}
.step{display:flex;gap:8px;align-items:center}
.step input[type=checkbox]{width:18px;height:18px;accent-color:var(--ok);flex:none}
.step input[type=text]{flex:1;border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 6px}
.step input[type=text]:hover,.step input[type=text]:focus{border-color:var(--line);background:var(--surface-2)}
.step .x{border:0;background:none;color:var(--muted);font-size:18px;width:28px;height:28px}
.toggle{display:flex;gap:8px;align-items:center;font-weight:600;font-size:14px}
.mailbox{border:1px solid var(--line);border-radius:var(--r-m);padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.mailbox .f input{background:var(--surface)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;font-size:14px}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.emptystate{max-width:520px;margin:40px auto;text-align:center;color:var(--ink-2)}
.emptystate h2{color:var(--ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:0 0 14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.track .wk .sh{display:none}
@media (max-width:760px){
 .bar-wrap{position:static}
 .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:12px}
 .chip{flex:none}
 .toolbar .seg{width:100%}
 .toolbar .seg button{flex:1;padding:7px 6px}
 .toolbar .fld{flex:1 1 45%}
 .toolbar .fld input[type=search]{width:100%;max-width:none}
 .track .wk .lg,.track .wk .dt{display:none}
 .track .wk .sh{display:inline}
 .count{gap:16px}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <div class="brand">
      <small>Planning de producción · uso interno Impulse</small>
      <h1>Empresas Inteligentes</h1>
      <p>Jueves 5 de noviembre · 08:00–17:00 · Prisma Business Tower, Magdalena del Mar</p>
    </div>
    <div class="count">
      <div><div class="big tnum" id="cd">–</div><div class="lbl" id="cdl">días para el evento</div></div>
      <div class="prog"><div class="big tnum" id="pv" style="font-size:28px;color:#fff">0%</div><div class="bar"><i id="pb" style="width:0"></i></div><div class="lbl" id="pl" style="margin-top:6px">–</div></div>
    </div>
  </div>
  <nav class="track" id="track" aria-label="Semanas hasta el evento"></nav>
</header>
<div class="bar-wrap">
  <div class="toolbar">
    <div class="seg" role="group" aria-label="Vista">
      <button data-view="week" aria-pressed="true">Semanas</button>
      <button data-view="cal" aria-pressed="false">Calendario</button>
      <button data-view="table" aria-pressed="false">Tabla</button>
      <button data-view="mail" aria-pressed="false">Correos</button>
    </div>
    <label class="fld"><input type="search" data-f="q" placeholder="Buscar tarea, persona o código" aria-label="Buscar"></label>
    <label class="fld"><select id="owner" data-f="owner" aria-label="Responsable"></select></label>
    <label class="fld"><select data-f="status_filter" aria-label="Estado"><option value="">Todos los estados</option><option value="pendiente">Pendiente</option><option value="curso">En curso</option><option value="listo">Listo</option><option value="bloqueado">Bloqueado</option></select></label>

async function removeTask(id){
  tasks=tasks.filter(x=>x.id!==id); render();
  if(mode==='db'){try{await db.collection('tasks').doc(id).delete();}catch(e){handleWriteError(e);}}
  else persistLocal();
}
function handleWriteError(e){
  const c=e&&e.code;
  if(c==='permission_denied'||c==='not_granted'||c==='invalid_argument'||c==='unauthenticated'){canWrite=false;toast('Tienes acceso de solo lectura a este planning');renderBanner();}
  else toast('No se guardó el cambio. Vuelve a intentarlo.');
}
async function seedDb(){
  const btn=$('#seedBtn'); if(btn){btn.disabled=true;btn.textContent='Cargando…';}
  try{for(const t of SEED){const b=clone(t);delete b.id;await db.collection('tasks').doc(t.id).set(b);}toast('Planning base cargado');}
  catch(e){handleWriteError(e);if(btn){btn.disabled=false;btn.textContent='Cargar planning base';}}
}

/* ---------- filtering ---------- */
function visible(){
  const q=ui.q.trim().toLowerCase();
  return tasks.filter(t=>ui.areas.has(t.area)
    &&(!ui.owner||(t.owners||[]).includes(ui.owner)||(t.owners||[]).includes('Todo el equipo'))
    &&(!ui.status||t.status===ui.status)&&(!ui.ms||t.milestone)
    &&(!q||(t.title+' '+(t.notes||'')+' '+(t.owners||[]).join(' ')+' '+(t.mail?t.mail.code:'')).toLowerCase().includes(q)));
}
const byDue=(a,b)=>a.due<b.due?-1:a.due>b.due?1:(a.milestone===b.milestone?(a.order||0)-(b.order||0):a.milestone?-1:1);

/* ---------- header ---------- */
function renderTop(){
  const left=diff(todayISO,EVENT);
  $('#cd').textContent=left>0?left:(left===0?'Hoy':'✓');
  $('#cdl').textContent=left>1?'días para el evento':left===1?'día para el evento':left===0?'es el evento':'evento realizado';
  const done=tasks.filter(t=>t.status==='listo').length;
  const pct=tasks.length?Math.round(done/tasks.length*100):0;
  $('#pv').textContent=pct+'%'; $('#pb').style.width=pct+'%';
  $('#pl').textContent=done+' de '+tasks.length+' tareas listas';
  // track
  const span=diff(PLAN0,EVENT)+1, pos=s=>Math.max(0,Math.min(100,diff(PLAN0,s)/span*100));
  let h='<div class="rail"></div>';
  const tp=pos(todayISO<PLAN0?PLAN0:todayISO); h+='<div class="done" style="width:'+tp+'%"></div>';
  WEEKS.slice(0,6).forEach(w=>{const a=pos(w.s),b=w.id==='s6'?100:pos(addDays(w.e,1));
    h+='<button class="wk'+(ui.view==='week'&&ui.week===w.id?' on':'')+'" data-wk="'+w.id+'" style="left:'+a+'%;width:'+(b-a)+'%" aria-label="'+esc(w.n+' · '+w.l)+'"><b><span class="lg">Semana </span><span class="sh">S</span>'+esc(w.n.replace('Semana ',''))+'</b><span class="dt">'+fmt(w.s)+'</span></button>';});
  tasks.filter(t=>t.milestone&&t.due<=EVENT&&t.due>=PLAN0).forEach(t=>{h+='<i class="ms'+(t.status==='listo'?' ok':'')+'" style="left:'+pos(t.due)+'%" title="'+esc(t.title)+'"></i>';});
  if(todayISO>=PLAN0&&todayISO<=EVENT)h+='<i class="today" style="left:'+tp+'%"></i>';
  h+='<i class="d-day" title="5 de noviembre"></i>';
  $('#track').innerHTML=h;
}
function renderBanner(){
  const b=$('#banner');
  if(mode==='local'){b.hidden=false;b.textContent='Los cambios se guardan en este navegador. Para pasarle tu versión al equipo usa Exportar JSON; quien la reciba la carga con Importar JSON.';}
  else if(mode==='db'&&!canWrite){b.hidden=false;b.textContent='Estás viendo el planning en modo lectura. Pide acceso de edición al dueño del artifact para ajustar tareas.';}
  else b.hidden=true;
}
function renderChips(){
  const counts={};tasks.forEach(t=>counts[t.area]=(counts[t.area]||0)+1);
  $('#chips').innerHTML='<button class="chip" data-all="1">Todas las áreas</button>'+Object.entries(AREAS).map(([k,a])=>'<button class="chip" style="--c:'+a.c+'" data-area="'+k+'" aria-pressed="'+ui.areas.has(k)+'"><i></i>'+esc(a.n)+' <span class="n">'+(counts[k]||0)+'</span></button>').join('');
}

/* ---------- card ---------- */
function card(t){
  const a=AREAS[t.area]||AREAS.coord; const st=t.steps||[]; const ok=st.filter(s=>s.ok).length;
  const late=t.status!=='listo'&&t.due<todayISO;
  const multi=t.start&&t.start<t.due;
  return '<div class="card'+(t.status==='listo'?' done':'')+'" style="--c:'+a.c+'" data-open="'+t.id+'" draggable="'+(canWrite)+'" data-drag="'+t.id+'" tabindex="0" role="button" aria-label="'+esc(t.title)+'">'
   +'<div class="row1"><button class="stt" data-s="'+t.status+'" data-cycle="'+t.id+'" aria-label="Estado: '+STATUS[t.status]+'. Cambiar" title="'+STATUS[t.status]+'"></button><span class="t">'+esc(t.title)+'</span></div>'
   +'<div class="meta"><span class="area">'+esc(a.n)+'</span>'
   +(t.milestone?'<span class="badge ms">Hito</span>':'')
   +(t.mail?'<span class="badge mail">'+esc(t.mail.code)+'</span>':'')
   +(t.prio==='A'&&t.status!=='listo'?'<span class="badge hi">Alta</span>':'')
   +(late?'<span class="badge late">Atrasada</span>':'')
   +(multi?'<span class="tnum">'+fmt(t.start)+' → '+fmt(t.due)+'</span>':'')
   +'<span class="avs">'+(t.owners||[]).slice(0,4).map(p=>'<span class="av" style="--pc:'+(PC[p]||'#6B4E9B')+'" title="'+esc(p)+'">'+esc(initials(p))+'</span>').join('')+'</span></div>'
   +(st.length?'<div class="stepbar" title="'+ok+' de '+st.length+' pasos"><i style="width:'+(ok/st.length*100)+'%"></i></div>':'')
   +'</div>';
}

/* ---------- views ---------- */
function viewWeek(){
  const w=WEEKS.find(x=>x.id===ui.week)||WEEKS[0]; const idx=WEEKS.indexOf(w);
  const vis=visible(); const inW=vis.filter(t=>t.due>=w.s&&t.due<=w.e).sort(byDue);
  const carry=vis.filter(t=>t.start<=w.e&&t.due>w.e&&t.status!=='listo').sort(byDue);
  let days=[];
  const long=diff(w.s,w.e)>9;
  for(let d=w.s;d<=w.e;d=addDays(d,1)){
    const has=inW.some(t=>t.due===d); const wd=dow(d);
    if(long?has:(has||(wd!==0&&wd!==6)))days.push(d);
  }
  const all=tasks.filter(t=>t.due>=w.s&&t.due<=w.e);
  const done=all.filter(t=>t.status==='listo').length;
  const ms=all.filter(t=>t.milestone).length, mails=all.filter(t=>t.mail).length;
  let h='<div class="wk-head"><h2>'+esc(w.n)+' · '+esc(w.l)+'</h2><span class="sub tnum">'+fmt(w.s,{weekday:'short',day:'numeric',month:'short'})+' – '+(w.id==='post'?'dic':fmt(w.e,{weekday:'short',day:'numeric',month:'short'}))+'</span>'
   +'<div class="wk-nav"><button class="btn" data-wknav="-1" '+(idx===0?'disabled':'')+' aria-label="Semana anterior">‹ Anterior</button><button class="btn" data-wknav="1" '+(idx===WEEKS.length-1?'disabled':'')+' aria-label="Semana siguiente">Siguiente ›</button></div></div>'
   +'<div class="wk-stats"><span><b class="tnum">'+all.length+'</b> tareas con entrega</span><span><b class="tnum">'+done+'</b> listas</span><span><b class="tnum">'+ms+'</b> hitos</span><span><b class="tnum">'+mails+'</b> correos</span></div>';
  if(carry.length)h+='<section class="carry"><h3>Siguen en curso esta semana (entregan después)</h3><div class="list">'+carry.map(card).join('')+'</div></section>';
  h+='<div class="days" style="--n:'+Math.max(days.length,1)+'">'+days.map(d=>{
    const list=inW.filter(t=>t.due===d);
    return '<section class="col'+(d===todayISO?' today':'')+(d===EVENT?' event':'')+'" data-drop="'+d+'"><div class="dh"><b>'+fmt(d,{weekday:'long'})+'</b><span class="tnum">'+fmt(d,{day:'numeric',month:'short'})+'</span></div>'
     +(HOL[d]?'<div class="hol">'+esc(HOL[d])+'</div>':'')
     +'<div class="stack">'+(list.length?list.map(card).join(''):'<div class="empty-day">Sin entregas</div>')+'</div></section>';
  }).join('')+'</div>';
  return h;
}
function viewCal(){
  const vis=visible();
  const months=[[2026,8],[2026,9],[2026,10]];
  let h='<div class="legend"><span>Arrastra una tarea a otro día para mover su entrega (el inicio se mueve igual).</span></div><div class="months">';
  months.forEach(([y,m])=>{
    const first=new Date(Date.UTC(y,m,1)); const last=new Date(Date.UTC(y,m+1,0));
    if(m===8){ /* solo mostrar última semana de septiembre dentro de octubre */ return; }
    let start=iso(first); while(dow(start)!==1)start=addDays(start,-1);
    let end=iso(last); while(dow(end)!==0)end=addDays(end,1);
    h+='<section class="month"><h2>'+['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'][m]+' '+y+'</h2><div class="grid">'
     +['lun','mar','mié','jue','vie','sáb','dom'].map(x=>'<div class="wd">'+x+'</div>').join('');
    for(let d=start;d<=end;d=addDays(d,1)){
      const out=D(d).getUTCMonth()!==m&&!(m===9&&d>=PLAN0); const list=vis.filter(t=>t.due===d).sort(byDue);
      const max=5;
      h+='<div class="cell'+(out?' out':'')+(d===todayISO?' today':'')+(d===EVENT?' event':'')+'" data-drop="'+d+'"><div class="dn"><span class="tnum">'+D(d).getUTCDate()+'</span>'+(HOL[d]?'<em>Feriado</em>':'')+(d===EVENT?'<em style="color:var(--plum-2)">Evento</em>':'')+'</div>'
       +list.slice(0,max).map(t=>'<button class="pill'+(t.status==='listo'?' done':'')+(t.milestone?' ms':'')+'" style="--c:'+(AREAS[t.area]||AREAS.coord).c+'" data-open="'+t.id+'" draggable="'+canWrite+'" data-drag="'+t.id+'" title="'+esc(t.title)+'">'+esc(t.title)+'</button>').join('')
       +(list.length>max?'<button class="more" data-gotoweek="'+d+'">+'+(list.length-max)+' más</button>':'')+'</div>';
    }
    h+='</div></section>';
  });
  return h+'</div>';
}
function viewTable(){
  const vis=visible();
  const key=ui.sort,dir=ui.sortDir;
  const sorter=(a,b)=>{let x,y;
    if(key==='owners'){x=(a.owners||[]).join();y=(b.owners||[]).join();}
    else if(key==='area'){x=AREAS[a.area].n;y=AREAS[b.area].n;}
    else{x=a[key]||'';y=b[key]||'';}
    return (x<y?-1:x>y?1:byDue(a,b))*dir;};
  const cols=[['status','Estado'],['title','Tarea'],['area','Área'],['owners','Responsables'],['start','Inicio'],['due','Entrega'],['prio','Prioridad']];
  let h='<div class="tbl-wrap"><table><thead><tr>'+cols.map(([k,n])=>'<th data-sort="'+k+'" aria-sort="'+(ui.sort===k?(dir>0?'ascending':'descending'):'none')+'">'+n+(ui.sort===k?(dir>0?' ▲':' ▼'):'')+'</th>').join('')+'</tr></thead><tbody>';
  const dis=canWrite?'':' disabled';
  const row=t=>{const a=AREAS[t.area]||AREAS.coord;return '<tr>'
    +'<td><select data-edit="status" data-id="'+t.id+'" aria-label="Estado"'+dis+'>'+Object.entries(STATUS).map(([k,n])=>'<option value="'+k+'"'+(t.status===k?' selected':'')+'>'+n+'</option>').join('')+'</select></td>'
    +'<td><button class="tl" data-open="'+t.id+'">'+(t.milestone?'◆ ':'')+esc(t.title)+'</button></td>'
    +'<td style="--c:'+a.c+'"><span class="dot"></span>'+esc(a.n)+'</td>'
    +'<td>'+esc((t.owners||[]).join(', '))+'</td>'
    +'<td><input type="date" data-edit="start" data-id="'+t.id+'" value="'+t.start+'" aria-label="Inicio"'+dis+'></td>'
    +'<td><input type="date" data-edit="due" data-id="'+t.id+'" value="'+t.due+'" aria-label="Entrega"'+dis+'></td>'
    +'<td><select data-edit="prio" data-id="'+t.id+'" aria-label="Prioridad"'+dis+'>'+Object.entries(PRIO).map(([k,n])=>'<option value="'+k+'"'+(t.prio===k?' selected':'')+'>'+n+'</option>').join('')+'</select></td></tr>';};
  if(ui.sort==='due'){
    WEEKS.forEach(w=>{const l=vis.filter(t=>weekOf(t.due)===w).sort(sorter);if(!l.length)return;
      h+='<tr class="grp"><td colspan="7">'+esc(w.n)+' · '+esc(w.l)+' <span style="font-weight:500;color:var(--muted)">('+l.length+')</span></td></tr>'+l.map(row).join('');});
  } else h+=vis.slice().sort(sorter).map(row).join('');
  return h+'</tbody></table></div>';
}
function viewMail(){
  const all=tasks.filter(t=>t.mail); const vis=visible().filter(t=>t.mail);
  const cnt=k=>all.filter(t=>t.mail.flow===k).length;
  let h='<div class="mail-sum"><div><b class="tnum">'+all.length+'</b><span>toques en total</span></div>'
   +FLOWS.map(f=>'<div style="border-top:3px solid '+f.c+'"><b class="tnum">'+cnt(f.k)+'</b><span>'+esc(STAGE_OF[f.k])+'</span></div>').join('')+'</div>'
   +'<section class="rules"><h3>Reglas de la secuencia</h3><ul>'
   +'<li>Un mensaje y un CTA por correo. El CTA siempre lleva a la landing (inscripción, elección de sala o agendamiento).</li>'
   +'<li>Siempre: jueves 5 de noviembre · 08:00–17:00 · Prisma Business Tower, Magdalena del Mar.</li>'
   +'<li>Costo: “cupos limitados” hasta que se decida. Urgencia solo con dato real de inscritos por sala.</li>'
   +'<li>A5 no sale sin al menos un speaker externo confirmado. F1 lleva la oferta de cierre de año solo cuando esté liberada.</li>'
   +'<li>Cada correo pasa por: copy → diseño → build → QA → aprobación → programación (checklist dentro de cada tarea).</li></ul></section>';
  FLOWS.forEach(f=>{
    const l=vis.filter(t=>t.mail.flow===f.k).sort((a,b)=>a.due<b.due?-1:a.due>b.due?1:a.mail.code.localeCompare(b.mail.code));
    if(!l.length)return;
    h+='<section class="lane" style="--lc:'+f.c+'"><h3>'+esc(f.k)+' · '+esc(f.n)+' <span style="color:var(--muted);font-weight:600;font-size:14px">'+l.length+' toques</span></h3><p class="ld">'+esc(f.d)+'</p><div class="seq">'
     +l.map(t=>'<div class="touch" data-open="'+t.id+'" role="button" tabindex="0"><button class="stt" data-s="'+t.status+'" data-cycle="'+t.id+'" aria-label="Estado: '+STATUS[t.status]+'"></button><div class="code">'+esc(t.mail.code)+'</div><div class="tt">'+esc(t.title.replace(/^[A-Z]\d?R?\s·\s/,''))+'</div><dl>'
       +'<dt>Envío</dt><dd class="tnum">'+fmt(t.due,{weekday:'short',day:'numeric',month:'short'})+'</dd>'
       +'<dt>Segmento</dt><dd>'+esc(t.mail.seg)+'</dd>'
       +'<dt>Disparador</dt><dd>'+esc(t.mail.trig)+'</dd>'
       +'<dt>CTA</dt><dd>'+esc(t.mail.cta)+'</dd>'
       +'<dt>Remitente</dt><dd>'+esc(t.mail.frm)+'</dd></dl></div>').join('')+'</div></section>';
  });
  return h;
}

/* ---------- drawer ---------- */
function openDrawer(id){
  const t=id?tasks.find(x=>x.id===id):null;
  ui.open=id||'new';
  ui.draft=t?clone(t):{id:'t'+Date.now().toString(36),area:'coord',title:'',owners:[],start:(WEEKS.find(w=>w.id===ui.week)||WEEKS[0]).s,due:(WEEKS.find(w=>w.id===ui.week)||WEEKS[0]).s,prio:'M',status:'pendiente',milestone:false,steps:[],notes:'',mail:null,order:9999};
  if(!ui.draft.start)ui.draft.start=ui.draft.due;
  renderDrawer(); setTimeout(()=>{const el=$('#d-title');if(el)el.focus();},30);
}

/* ---------- render ---------- */
function render(){
  renderTop(); renderChips(); renderBanner();
  document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===ui.view));
  const m=$('#main');
  if(mode==='loading'){m.innerHTML='<div class="loading">Cargando planning…</div>';return;}
  if(mode==='db'&&!tasks.length){m.innerHTML='<div class="emptystate"><h2>El planning está vacío</h2><p>Carga las tareas base del brief v4 para empezar a ajustarlas con el equipo.</p>'+(canWrite?'<button class="btn pri" id="seedBtn" data-seed="1">Cargar planning base</button>':'<p>Pide al dueño del artifact que cargue el planning.</p>')+'</div>';return;}
  m.innerHTML=ui.view==='week'?viewWeek():ui.view==='cal'?viewCal():ui.view==='table'?viewTable():viewMail();
}

/* ---------- events ---------- */
function cycle(id){if(!canWrite)return;const t=tasks.find(x=>x.id===id);if(!t)return;const order=['pendiente','curso','listo','bloqueado'];const n=clone(t);n.status=order[(order.indexOf(t.status)+1)%order.length];saveTask(n);}
document.addEventListener('click',e=>{
  const el=e.target.closest('button,[data-open],[data-wk]'); if(!el)return;
  const ds=el.dataset;
  if(ds.cycle){e.stopPropagation();cycle(ds.cycle);return;}
  if(ds.view){ui.view=ds.view;saveUI();render();return;}
  if(ds.wk){ui.view='week';ui.week=ds.wk;saveUI();render();window.scrollTo({top:$('#main').offsetTop-80});return;}
  if(ds.wknav){const i=WEEKS.findIndex(w=>w.id===ui.week)+Number(ds.wknav);if(WEEKS[i]){ui.week=WEEKS[i].id;saveUI();render();}return;}
  if(ds.gotoweek){ui.week=weekOf(ds.gotoweek).id;ui.view='week';saveUI();render();return;}
  if(ds.all){const allOn=ui.areas.size===Object.keys(AREAS).length;ui.areas=new Set(allOn?[]:Object.keys(AREAS));render();return;}
  if(ds.area){ui.areas.has(ds.area)?ui.areas.delete(ds.area):ui.areas.add(ds.area);render();return;}
  if(ds.sort){if(ui.sort===ds.sort)ui.sortDir*=-1;else{ui.sort=ds.sort;ui.sortDir=1;}render();return;}
  if(ds.seed){seedDb();return;}
  if(ds.close){closeDrawer();return;}
  if(ds.person&&ui.draft){const o=ui.draft.owners||[];ui.draft.owners=o.includes(ds.person)?o.filter(x=>x!==ds.person):o.concat(ds.person);el.setAttribute('aria-pressed',ui.draft.owners.includes(ds.person));return;}
  if(ds.stepAdd&&ui.draft){ui.draft.steps=(ui.draft.steps||[]).concat({t:'',ok:false});renderDrawer();const ins=document.querySelectorAll('[data-step-t]');if(ins.length)ins[ins.length-1].focus();return;}
  if(ds.stepX&&ui.draft){ui.draft.steps.splice(Number(ds.stepX),1);renderDrawer();return;}
  if(ds.save&&ui.draft){const d=ui.draft;if(!d.title.trim()){toast('Escribe el nombre de la tarea');$('#d-title').focus();return;}
    if(d.start>d.due)d.start=d.due; d.steps=(d.steps||[]).filter(s=>s.t.trim());
    if(d.area!=='email')d.mail=d.mail||null;
    saveTask(clone(d));closeDrawer();toast('Cambios guardados');return;}
  if(ds.dup&&ui.draft){const n=clone(ui.draft);n.id='t'+Date.now().toString(36);n.title=n.title+' (copia)';n.status='pendiente';n.steps=(n.steps||[]).map(s=>({t:s.t,ok:false}));saveTask(n);closeDrawer();toast('Tarea duplicada');return;}
  if(ds.del&&ui.draft){if(confirm('¿Eliminar “'+ui.draft.title+'”? No se puede deshacer.')){removeTask(ui.draft.id);closeDrawer();toast('Tarea eliminada');}return;}
  if(ds.new){openDrawer(null);return;}
  if(ds.export){exportCSV();return;}
  if(ds.exportj){exportJSON();return;}
  if(ds.importj){$('#imp').click();return;}
  if(ds.reset){resetSeed();return;}
  if(ds.open){openDrawer(ds.open);return;}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&ui.open){closeDrawer();return;}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-open][role="button"]')){e.preventDefault();openDrawer(e.target.dataset.open);}
});
document.addEventListener('input',e=>{
  const el=e.target,ds=el.dataset;
  if(ds.f==='q'){ui.q=el.value;render();return;}
  if(!ui.draft||el.closest('.toolbar'))return;
  if(ds.f&&ds.f!=='milestone'&&ds.f!=='q'){ui.draft[ds.f]=el.value;
    if(ds.f==='area'){renderDrawer();}
    return;}
  if(ds.stepT!=null){ui.draft.steps[Number(ds.stepT)].t=el.value;return;}
  if(ds.m){ui.draft.mail=ui.draft.mail||{code:'',flow:'A',seg:'',cta:'',frm:'',trig:''};ui.draft.mail[ds.m]=el.value;return;}
});
document.addEventListener('change',e=>{
  const el=e.target,ds=el.dataset;
  if(ds.f==='owner'){ui.owner=el.value;render();return;}
  if(ds.f==='status_filter'){ui.status=el.value;render();return;}
  if(ds.f==='msonly'){ui.ms=el.checked;render();return;}
  if(ds.edit){const t=tasks.find(x=>x.id===ds.id);if(!t)return;const n=clone(t);n[ds.edit]=el.value;
    if(ds.edit==='due'&&n.start>n.due)n.start=n.due; if(ds.edit==='start'&&n.start>n.due)n.due=n.start; saveTask(n);return;}
  if(!ui.draft)return;
  if(ds.f==='milestone'){ui.draft.milestone=el.checked;return;}
  if(ds.stepOk!=null){ui.draft.steps[Number(ds.stepOk)].ok=el.checked;renderDrawer();return;}
});
/* drag & drop */
let dragId=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest('[data-drag]');if(!c||!canWrite)return;dragId=c.dataset.drag;e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',dragId);}catch(_){}});
document.addEventListener('dragover',e=>{const z=e.target.closest('[data-drop]');if(!z||!dragId)return;e.preventDefault();document.querySelectorAll('.drop').forEach(x=>x!==z&&x.classList.remove('drop'));z.classList.add('drop');});
document.addEventListener('dragleave',e=>{const z=e.target.closest('[data-drop]');if(z&&!z.contains(e.relatedTarget))z.classList.remove('drop');});
document.addEventListener('drop',e=>{const z=e.target.closest('[data-drop]');if(!z||!dragId)return;e.preventDefault();z.classList.remove('drop');
  const t=tasks.find(x=>x.id===dragId);dragId=null;if(!t)return;const nd=z.dataset.drop;if(nd===t.due)return;
  const n=clone(t);const delta=diff(t.due,nd);n.due=nd;n.start=addDays(t.start||t.due,delta);saveTask(n);toast('Entrega movida al '+fmt(nd,{weekday:'long',day:'numeric',month:'long'}));});
document.addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.drop').forEach(x=>x.classList.remove('drop'));});

/* ---------- export ---------- */
function saveBlob(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
function exportJSON(){saveBlob('planning-empresas-inteligentes-'+todayISO+'.json',new Blob([JSON.stringify({v:1,exported:new Date().toISOString(),tasks},null,1)],{type:'application/json'}));toast('Versión exportada');}
function importJSON(file){const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);const list=Array.isArray(o)?o:o.tasks;
  if(!Array.isArray(list)||!list.every(t=>t&&t.id&&t.title&&t.due&&t.area&&AREAS[t.area]))throw new Error('formato');
  if(!confirm('Esto reemplaza las '+tasks.length+' tareas de este navegador por las '+list.length+' del archivo. ¿Continuar?'))return;
  tasks=list;persistLocal();render();toast('Planning importado');}catch(e){toast('El archivo no es un planning válido');}};r.readAsText(file);}
document.addEventListener('change',e=>{if(e.target.id==='imp'&&e.target.files[0]){importJSON(e.target.files[0]);e.target.value='';}});
function resetSeed(){if(confirm('¿Volver al planning base? Se pierden los cambios hechos en este navegador.')){tasks=clone(SEED);persistLocal();render();toast('Planning base restaurado');}}
async function exportCSV(){
  
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const head=['Semana','Entrega','Inicio','Área','Tarea','Responsables','Estado','Prioridad','Hito','Código correo','Segmento','Disparador','CTA','Remitente','Pasos','Notas'];
  const rows=tasks.slice().sort(byDue).map(t=>[weekOf(t.due).n,t.due,t.start,AREAS[t.area].n,t.title,(t.owners||[]).join(', '),STATUS[t.status],PRIO[t.prio],t.milestone?'Sí':'',t.mail?t.mail.code:'',t.mail?t.mail.seg:'',t.mail?t.mail.trig:'',t.mail?t.mail.cta:'',t.mail?t.mail.frm:'',(t.steps||[]).map(s=>(s.ok?'[x] ':'[ ] ')+s.t).join(' | '),t.notes||'']);
  const csv='\ufeff'+[head].concat(rows).map(r=>r.map(q).join(';')).join('\r\n');
  saveBlob('planning-empresas-inteligentes.csv',new Blob([csv],{type:'text/csv;charset=utf-8'}));toast('CSV descargado');
}

/* ---------- boot ---------- */
$('#owner').innerHTML='<option value="">Todas las personas</option>'+PEOPLE.filter(p=>p!=='Todo el equipo').map(p=>'<option>'+esc(p)+'</option>').join('');
render();
function boot(){mode='local';loadLocal();render();}
boot();
})();
</script>
